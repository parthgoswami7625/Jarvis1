<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyan-glow)" stroke-width="12" stroke-dasharray="80 30" stroke-linecap="round" />

  <!-- Inner Concentric Orbitals -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="10 15" />
  <circle cx="256" cy="256" r="80" fill="#0369a1" fill-opacity="0.15" stroke="url(#cyan-glow)" stroke-width="8" />

  <!-- Central Core Hexagon -->
  <polygon points="256,206 299,231 299,281 256,306 213,281 213,231" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="6" />

  <!-- Soundwave Nodes -->
  <line x1="256" y1="130" x2="256" y2="150" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="362" x2="256" y2="382" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="130" y1="256" x2="150" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="362" y1="256" x2="382" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="256" r="18" fill="#38bdf8" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
